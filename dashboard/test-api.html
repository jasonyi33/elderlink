<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 1200px; margin: 0 auto; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
        pre { background: #f4f4f4; padding: 15px; overflow-x: auto; border-radius: 5px; }
        .success { color: green; }
        .error { color: red; }
    </style>
</head>
<body>
    <h1>ElderLink API Test</h1>

    <div>
        <button onclick="testDashboardAPI()">Test Dashboard API</button>
        <button onclick="testProfileAPI()">Test Profile API</button>
        <button onclick="testHealthCheck()">Test Health Check</button>
        <button onclick="clearResults()">Clear Results</button>
    </div>

    <div id="results"></div>

    <script>
        const WORKER_URL = 'https://elderlink-dev.elderlinkhelper.workers.dev';

        function log(message, isError = false) {
            const results = document.getElementById('results');
            const div = document.createElement('div');
            div.className = isError ? 'error' : 'success';
            div.innerHTML = message;
            results.appendChild(div);
        }

        function clearResults() {
            document.getElementById('results').innerHTML = '';
        }

        async function testDashboardAPI() {
            log('<h2>Testing Dashboard API</h2>');
            const url = `${WORKER_URL}/api/dashboard/mrs-chen`;
            log(`URL: ${url}`);

            try {
                const response = await fetch(url);
                log(`Status: ${response.status} ${response.statusText}`);

                const data = await response.json();
                log(`<pre>${JSON.stringify(data, null, 2)}</pre>`);

                if (data.profile) {
                    log(`✅ Profile found: ${data.profile.name}, Age: ${data.profile.age}, Wellness: ${data.profile.wellnessMetrics.holisticScore}`);
                } else {
                    log('❌ No profile in response', true);
                }
            } catch (error) {
                log(`❌ Error: ${error.message}`, true);
                console.error(error);
            }
        }

        async function testProfileAPI() {
            log('<h2>Testing Profile API</h2>');
            const url = `${WORKER_URL}/api/senior/mrs-chen`;
            log(`URL: ${url}`);

            try {
                const response = await fetch(url);
                log(`Status: ${response.status} ${response.statusText}`);

                const data = await response.json();
                log(`<pre>${JSON.stringify(data, null, 2)}</pre>`);

                if (data.name) {
                    log(`✅ Profile found: ${data.name}, Age: ${data.age}, Wellness: ${data.wellnessMetrics.holisticScore}`);
                } else {
                    log('❌ No profile data', true);
                }
            } catch (error) {
                log(`❌ Error: ${error.message}`, true);
                console.error(error);
            }
        }

        async function testHealthCheck() {
            log('<h2>Testing Health Check</h2>');
            const url = `${WORKER_URL}/api/health`;
            log(`URL: ${url}`);

            try {
                const response = await fetch(url);
                log(`Status: ${response.status} ${response.statusText}`);

                const data = await response.json();
                log(`<pre>${JSON.stringify(data, null, 2)}</pre>`);
                log(`✅ Worker is healthy: ${data.status}`);
            } catch (error) {
                log(`❌ Error: ${error.message}`, true);
                console.error(error);
            }
        }

        // Run health check on page load
        window.onload = () => {
            log('<p>Page loaded. Click buttons to test API endpoints.</p>');
        };
    </script>
</body>
</html>
