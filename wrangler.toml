name = "elderlink"
main = "worker/src/index.ts"
compatibility_date = "2025-01-18"
account_id = "1a12fe1e4724fdc46a36663cc6f8e7b7"

# Development environment
[env.dev]
name = "elderlink-dev"
workers_dev = true

[[env.dev.kv_namespaces]]
binding = "KV"
id = "0da346fb61be4a37b28d119fcc886f6b"
preview_id = "4f157367c7794f63af98b974165d6c94"

# Production environment
[env.production]
name = "elderlink-prod"
workers_dev = false
route = "elderlink.com/*"

[[env.production.kv_namespaces]]
binding = "KV"
id = "0da346fb61be4a37b28d119fcc886f6b"

# Environment variables (secrets)
[vars]
ENVIRONMENT = "development"

# Note: Sensitive variables should be set via wrangler secret
# wrangler secret put GEMINI_API_KEY
# wrangler secret put VAPI_API_KEY
# wrangler secret put ELEVENLABS_API_KEY
# wrangler secret put ELEVENLABS_ENGLISH_VOICE
# wrangler secret put ELEVENLABS_MANDARIN_VOICE